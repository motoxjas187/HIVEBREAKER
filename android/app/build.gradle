plugins { id 'com.android.application' }
android {
    namespace 'com.hivebreaker.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.hivebreaker.game'
        minSdk 26
        targetSdk 34
        // CI passes the run number so every build installs over the last one
        def bn = (project.findProperty('buildNumber') ?: '1').toString()
        versionCode = bn.toInteger()
        versionName = "0." + bn
    }
    // One fixed TEST key so every build installs over the last one.
    // Not for the Play Store: a release key must stay private.
    signingConfigs {
        debug {
            storeFile file('test.keystore')
            storePassword 'hivebreaker-test'
            keyAlias 'test'
            keyPassword 'hivebreaker-test'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
