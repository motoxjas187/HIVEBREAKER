name: Generate and pack ore models

on:
  push:
    branches: [main]
    paths:
      - "tools/generate_abyssal_ore_blocks.py"
      - "tools/pack_ore_models.py"
      - "assets/ores/manifest.json"
      - ".github/workflows/generate-ore-models.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install generator dependency
        run: python -m pip install trimesh
      - name: Generate GLB models
        run: python tools/generate_abyssal_ore_blocks.py
      - name: Pack GLB models for the play link
        run: python tools/pack_ore_models.py
      - name: Commit generated models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ores/glb assets/ores/ore_models.js
          if git diff --cached --quiet; then
            echo "Generated assets are already up to date."
          else
            git commit -m "Generate and pack expanded Abyssal ore models"
            git push
          fi
